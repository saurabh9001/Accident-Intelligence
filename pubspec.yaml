name: saferoute_ai
description: AI-Enhanced Road Safety & Blackspot Alert System

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core functionality
  shared_preferences: ^2.2.2
  
  # Image and camera functionality
  image_picker: ^1.0.4
  
  # Math operations for AI calculations
  # collection: ^1.17.0
  
  # Location services (for future implementation)
  # geolocator: ^10.1.0
  # location: ^5.0.3
  
  # Maps (for future implementation)
  # google_maps_flutter: ^2.5.0
  
  # Sensors (for future implementation)
  # sensors_plus: ^4.0.2
  
  # HTTP requests (for future implementation)
  # dio: ^5.3.2
  # http: ^1.1.0
  
  # State management (for future implementation)
  # provider: ^6.1.1
  # flutter_bloc: ^8.1.3
  
  # Local storage (for future implementation)
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0
  
  # Notifications (for future implementation)
  # flutter_local_notifications: ^16.3.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
